name: Build WankizGram APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'TMessagesProj_AppHuawei/**'
      - 'TMessagesProj_AppHockeyApp/**'
      - 'TMessagesProj_AppStandalone/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: wankizgram-debug-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WankizGram debug APK
        run: timeout --signal=TERM --kill-after=60s 55m ./gradlew --no-daemon --max-workers=2 :TMessagesProj_App:assembleAfatDebug

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj_App/build/outputs/apk/afat/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WankizGram-debug
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
